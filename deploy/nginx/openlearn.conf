# OpenLearn 反向代理参考配置。
# 配套：进程环境变量 TRUST_PROXY=1（只有这一层 Nginx 时）。
# 应用若同时对公网暴露 9000，不要设置 TRUST_PROXY。
#
# docker compose --profile proxy 会把本文件挂进 nginx，upstream 名是 compose 服务名 app。
# 裸机 Nginx 把下面的 app:9000 改成 127.0.0.1:9000。

upstream openlearn_backend {
    server app:9000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 110m;

    location /socket.io/ {
        proxy_pass http://openlearn_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /runtime/ {
        proxy_pass http://openlearn_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 课件 HTML 自带 CSP。Nginx 再加一条会盖掉它，内联脚本被拦。
        proxy_hide_header Content-Security-Policy;
    }

    location / {
        proxy_pass http://openlearn_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
