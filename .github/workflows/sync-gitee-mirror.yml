name: Sync Gitee Mirror

# 目的：把 GitHub 主仓的 main **单向**快进到 Gitee 镜像
# （gitee.com/aymwoo/openlearn-next），让国内网络访问 GitHub 受限的开发者
# 仍能克隆源码、提交 Issue。
#
# 三条铁律（与 AGENTS.md / docs/contributing/contributing.md 的口径一致）：
#   ① **单向**：只从 GitHub 推往 Gitee，绝不反向；
#   ② **只快进**：镜像的 main 必须是当前 HEAD 的祖先，否则**停止并报错**，
#      绝不 force-push（否则会冲掉 GitHub 上的合并结果）；
#   ③ **不阻塞主干**：token 缺失 / 网络不通 / 镜像分叉都只让本 job 失败，
#      不影响主干的其它 CI（continue-on-error）。
#
# 失败可观测性（2026-11-14 加固）：
#   · job 级 continue-on-error 会把失败吞成 run 结论 success，因此新增
#     「同步结果」步骤，把 skipped / success / failure 三态写进 Step Summary，
#     失败时额外打 ::error annotation —— 判断同步结果请以 Summary 为准；
#   · 具体逻辑抽到 .github/scripts/sync-gitee-mirror.sh，避免 Actions 把
#     多行 run: 源码逐行回显（回显里的 SKIP_SYNC=1 / ::error 字面量曾造成误判）；
#   · 手动触发可选 strict=true，让失败直接反映到 run 结论，便于维护者验证配置。
#     push / schedule 仍永远宽松，不阻塞主干；
#   · 只同步 main：拒绝 --ref <非默认分支> 触发时把 PR 提交写进镜像
#     （此时 github.sha 是分支 HEAD，且 main 恰为其祖先，祖先校验拦不住）。
#
# 一次性配置（仓库维护者做一次即可，缺 secret 时本 workflow 自动跳过）：
#   1. 在 Gitee 生成「私人访问令牌」：设置 → 私人令牌 → 勾选 `projects` 权限；
#   2. 在 GitHub 仓库添加两个 Secret：
#        GITEE_USERNAME = Gitee 用户名（aymwoo）
#        GITEE_TOKEN    = 上一步生成的令牌
#   3. 本 workflow 会在每次 main 推送后自动同步；也可手动触发（workflow_dispatch）。
#
# 本地验证过的三种情形（2026-11-03）：
#   · 镜像落后        → 正常快进，main 与 tag 同步；
#   · 镜像分叉        → 退出码 1，镜像 SHA 未变（确认没有 force-push）；
#   · 镜像无 main      → 首次同步成功，并带上全部 tag。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict:
        description: '严格模式：同步失败时让本次运行直接失败（默认关闭，避免误报阻塞）'
        type: choice
        required: false
        default: 'false'
        options:
          - 'false'
          - 'true'
  schedule:
    # 兜底：push 时的同步可能因网络抖动失败，每 6 小时补一次
    - cron: '17 */6 * * *'

concurrency:
  group: gitee-mirror-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: 快进 Gitee 镜像
    runs-on: ubuntu-latest
    # 铁律 ③：push / schedule 触发时永远宽松，失败不阻塞主干 CI。
    # 仅手动触发且显式 strict=true 时关闭宽松，让失败真实反映到 run 结论。
    continue-on-error: ${{ github.event_name != 'workflow_dispatch' || inputs.strict != 'true' }}
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_USER: ${{ secrets.GITEE_USERNAME }}
      EXPECTED: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要完整历史与 tag：快进判定要祖先关系，tag 同步要完整引用
          fetch-depth: 0

      - name: 准备远端与凭据
        id: prepare
        run: bash .github/scripts/sync-gitee-mirror.sh prepare

      - name: 快进 main 与 tag
        id: push
        if: env.SKIP_SYNC != '1'
        run: bash .github/scripts/sync-gitee-mirror.sh push

      - name: 复核镜像 HEAD
        id: verify
        if: env.SKIP_SYNC != '1'
        run: bash .github/scripts/sync-gitee-mirror.sh verify

      - name: 同步结果
        if: always()
        run: bash .github/scripts/sync-gitee-mirror.sh summary
        env:
          OUTCOME_PREPARE: ${{ steps.prepare.outcome }}
          OUTCOME_PUSH: ${{ steps.push.outcome }}
          OUTCOME_VERIFY: ${{ steps.verify.outcome }}
