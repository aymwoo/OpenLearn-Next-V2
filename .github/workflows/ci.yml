name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    # 说明（与实测对齐）：在 PR 上创建评论时，GitHub 返回的
    # `x-accepted-github-permissions` 是 `issues=write; pull_requests=write`。
    # 仅声明 `issues: write` 时该步骤会 403（Resource not accessible by
    # integration），从而把整个 job 判为失败 —— 而 typecheck/test 本身是过的。
    # 因此这里同时声明两者，并给评论步骤加 continue-on-error 兜底。
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      # pnpm must be set up *before* setup-node, otherwise `cache: 'pnpm'` cannot
      # locate the pnpm store.
      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # This is a pnpm workspace with no package-lock.json, so the previous
      # `cache: 'npm'` + `npm ci` pair always failed with ENOLOCK before any
      # type checking or test ran.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Strict type check
        run: pnpm lint:strict

      - name: Run tests
        run: pnpm test

      # Reports the outcome of the steps above. It deliberately does NOT re-run
      # the suite: the previous implementation shelled out to a second
      # `vitest run --reporter=json` whose output exceeded execSync's 1 MB buffer.
      - name: Comment CI result on PR
        if: github.event_name == 'pull_request' && success()
        # 评论只是「锦上添花」的反馈：fork PR（token 只读）或仓库权限收紧时
        # 必然 403。不应因此把 typecheck/test 通过的 job 判为失败。
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                '## CI Results',
                '',
                '✅ `pnpm lint` (tsc --noEmit) passed',
                '✅ `pnpm lint:strict` (tsc strict) passed',
                '✅ `pnpm test` (vitest) passed',
              ].join('\n'),
            });

  # 固定版本的真实插件作为宿主兼容性金丝雀。
  # 更新插件基线时同步修改下方三处 ref；每个门禁运行都可复现相同插件源码。
  # ═══════════════════════════════════════════════════════════════════════════
  # Windows 平台探测（**非阻塞**）
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # 存在的理由：L-1（进程隔离）、L-2（bootstrap 与 PluginHost 拆分）全部在 Linux
  # 上开发与验证 —— 此前本文件的 6 个 job **无一例外**是 ubuntu-latest，仓库里也
  # 没有任何 Windows 平台分支、docs/README 里零处 Windows 提及。而产品的主要
  # 用户据称在 Windows 上。
  #
  # 其中有几件事处于「未知」状态，任何一件为「否」都会让某个默认行为失效：
  #
  #   · `--permission` 不可用 → L-1 P2 的权限收敛整个失效。而 P2 把它**默认开启**，
  #     后果是 Windows 上插件直接起不来。
  #   · `--disallow-code-generation-from-strings` 不可用 → eval/new Function 禁令失效。
  #   · 信号终止后 exit.code 不为 null → 现有集成测试会在 Windows 上红。
  #
  # 这些都无法在 Linux 上回答，所以本 job 的产物是**那张表变成有据**，而不是一个
  # 绿色的勾。因此：
  #
  #   · `continue-on-error: true` —— 故意不卡合并。首跑大概率有红，红了才是信息。
  #   · 先跑 `probe-platform-capabilities.mjs`：它只报告不改状态，输出人可读，
  #     且作为 artifact 上传 —— 即使测试全红，报告也能回答「Windows 上能不能跑」。
  #   · 再跑平台最敏感的两个测试目录（worker-runtime / plugin-host）。这两个目录
  #     覆盖子进程 spawn、权限旗标、路径归一化、信号语义。
  #
  # ⚠️ 本 job 由 agent 在 Linux 上编写，**从未在 Windows 上跑过**。首次运行的结果
  #    就是它存在的意义 —— 请把首次结果当作「Windows 支持现状」的第一次实测，
  #    而不是回归失败。
  #
  # 待办：把首次红项分类（真缺陷 / 平台差异 / 探针自身写错），修完后移除
  #       continue-on-error，转为阻塞门禁。
  windows-platform-probe:
    name: Windows platform probe (non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Probe platform capabilities
        run: node scripts/probe-platform-capabilities.mjs

      - name: Upload capability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-capability-report-windows
          path: dist/platform-capability-report.txt
          if-no-files-found: warn

      - name: Type check
        run: pnpm lint

      - name: Platform-sensitive unit tests
        run: pnpm vitest run packages/core/worker-runtime packages/core/plugin-host

      - name: Dump worker-runtime test output on failure
        if: failure()
        run: pnpm vitest run packages/core/worker-runtime --reporter=verbose

  plugin-compatibility:
    name: Third-party plugin compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install platform dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout attendance-record compatibility fixture
        uses: actions/checkout@v4
        with:
          repository: openlearn-next/attendance-record
          ref: ce8541e7a48b286574ffd620fa167cf5b139e451
          path: .plugin-compatibility-sources/attendance-record

      - name: Checkout class_manager compatibility fixture
        uses: actions/checkout@v4
        with:
          repository: openlearn-next/class_manager
          ref: 941b556f0017ec20e8a8d7a1f75d1dd9f80dd26f
          path: .plugin-compatibility-sources/class_manager

      - name: Checkout interactive-courseware compatibility fixture
        uses: actions/checkout@v4
        with:
          repository: openlearn-next/interactive-courseware
          ref: d622e0a54463813631f41589fa8d24082160b39d
          path: .plugin-compatibility-sources/interactive-courseware

      - name: Build attendance-record
        working-directory: .plugin-compatibility-sources/attendance-record
        run: npm install --no-audit --no-fund && npm run build

      - name: Build class_manager
        working-directory: .plugin-compatibility-sources/class_manager
        # Its esbuild config bundles @openlearn/plugin-sdk with external: [],
        # and the pinned SDK build imports uuid; supply the missing build-time dep.
        run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund uuid@14.0.1 && npm run build

      - name: Build interactive-courseware
        working-directory: .plugin-compatibility-sources/interactive-courseware
        run: pnpm install --no-frozen-lockfile && pnpm build

      - name: Stage plugin ZIP fixtures
        run: |
          node scripts/stage-plugin-compat-fixture.mjs attendance-record .plugin-compatibility-sources/attendance-record .plugin-compatibility-fixtures
          node scripts/stage-plugin-compat-fixture.mjs class_manager .plugin-compatibility-sources/class_manager .plugin-compatibility-fixtures
          node scripts/stage-plugin-compat-fixture.mjs interactive-courseware .plugin-compatibility-sources/interactive-courseware .plugin-compatibility-fixtures

      - name: Install and activate fixtures in the PR platform runtime
        env:
          OPENLEARN_PLUGIN_COMPAT_FIXTURES: .plugin-compatibility-fixtures
        run: pnpm exec vitest run server/__tests__/canary/plugin-compatibility.test.ts

  browser-workflow-e2e:
    name: Browser workflow E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: pnpm exec playwright test e2e/lesson-classroom-flow.spec.ts

  docs-drift-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run docs-vs-code architecture drift audit
        id: audit
        run: bash audit-tools/run.sh

      - name: Upload drift report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: audit-tools/reports/drift_report.md

      - name: Comment drift report on PR
        if: github.event_name == 'pull_request' && always() && steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('audit-tools/reports/drift_report.md')
              ? fs.readFileSync('audit-tools/reports/drift_report.md', 'utf8')
              : 'No report file produced.';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                '## 📝 Architecture Docs Drift Audit — FAILED',
                '',
                'The architecture docs-vs-code audit detected drift. Please update the affected docs (or run `bash audit-tools/run.sh` locally to inspect).',
                '',
                '<details><summary>Full drift report</summary>',
                '',
                '```',
                report,
                '```',
                '',
                '</details>',
              ].join('\n'),
            });

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      # `npm audit` cannot work here (no package-lock.json → ENOLOCK).
      # Non-blocking on purpose: the repo currently carries pre-existing high
      # advisories in transitive dev dependencies (browserslist via
      # @vitejs/plugin-react). Flip continue-on-error to false once triaged.
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level high

  # 覆盖率独立成 job（typecheck-and-test 失败不影响收集）。
  # ⚠️ 已知行为：vitest 4 在测试运行存在失败用例时会静默跳过覆盖报告
  # （本地实测 v4.1.9 复现）。因此此 job 的意义在于「全绿时产出基线」；
  # 若需失败场景也出报告，需升级 vitest 或拆分失败用例。
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage -- --coverage.reporter=json-summary

      - name: Append summary to job summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage" >> $GITHUB_STEP_SUMMARY
            node -e "const t = require('./coverage/coverage-summary.json').total; console.log('| 指标 | 覆盖率 |\\n|---|---|'); for (const k of ['lines','statements','functions','branches']) console.log('| ' + k + ' | ' + t[k].pct + '% |')" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Coverage" >> $GITHUB_STEP_SUMMARY
            echo "coverage-summary.json 未生成（测试存在失败用例时 vitest 会跳过覆盖报告）" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
