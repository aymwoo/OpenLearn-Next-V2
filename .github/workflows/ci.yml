name: CI

# pnpm 不写 version: latest。pnpm/action-setup 在省略 version 时读取
# package.json 的 packageManager（pnpm@10.33.4），与 Dockerfile / 本地开发一致。
# pnpm 12 默认开启 minimumReleaseAge，会拒绝锁文件里当天发布的传递依赖。
# JavaScript action 使用 Node 24 运行时（checkout/setup-node/setup-python/
# upload-artifact/github-script/pnpm action-setup 的当前主版本），
# 避免 actions 仍声明 Node 20 时的弃用警告。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Issue #229：路由数据范围声明门禁（route-scope）。
#
# 服务端启动时会审计所有「已认证但未声明数据范围」的路由
# （server/security/route-scope.ts 的 assertRouteDataScopes）：
# - 默认只告警（迁移期口径）；
# - ROUTE_SCOPE_ENFORCE=true 时直接抛错 —— 服务器**起不来**，CI 即红。
#
# 这个变量此前从未被设置过，门禁形同虚设：新增路由不声明数据范围不会被任何人发现。
# 现在在 CI 全局启用，让「漏声明」变成硬失败。
env:
  ROUTE_SCOPE_ENFORCE: 'true'

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    # 说明（与实测对齐）：在 PR 上创建评论时，GitHub 返回的
    # `x-accepted-github-permissions` 是 `issues=write; pull_requests=write`。
    # 仅声明 `issues: write` 时该步骤会 403（Resource not accessible by
    # integration），从而把整个 job 判为失败 —— 而 typecheck/test 本身是过的。
    # 因此这里同时声明两者，并给评论步骤加 continue-on-error 兜底。
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      # pnpm must be set up *before* setup-node, otherwise `cache: 'pnpm'` cannot
      # locate the pnpm store.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      # This is a pnpm workspace with no package-lock.json, so the previous
      # `cache: 'npm'` + `npm ci` pair always failed with ENOLOCK before any
      # type checking or test ran.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepare 已在 install 时构建 SDK。这里再显式跑一次，避免 --ignore-scripts
      # 或缓存层跳过 lifecycle 时，tsc 仍然找不到 dist。
      - name: Build plugin SDK
        run: node scripts/build-plugin-sdk.mjs

      # 源码编码检查（Issue #130）：U+FFFD 与非法 UTF-8 字节不会导致编译或测试
      # 失败，却会直接损坏用户可见的中文文案，只能在 CI 里显式拦截。
      - name: Source encoding check
        run: pnpm lint:encoding

      - name: Type check
        run: pnpm lint

      # 严格类型检查是合并门禁（strict / noImplicitAny / strictNullChecks）。
      # 失败即红，不要加 continue-on-error。
      - name: Strict type check
        run: pnpm lint:strict

      # Issue #231：ESLint 告警预算棘轮 —— 超过 config/lint-budget.json 里的基线即红
      # （不许欠新债）。基线只能往下走：清理告警后运行
      # `node scripts/check-lint-budget.mjs --update` 收紧。
      # 此前 lint:eslint 完全不在 CI 里，6186 条告警（其中 no-explicit-any 占大头）
      # 可以无限增长；而类型检查对 `any` 这类位置无能为力。
      - name: ESLint warning budget
        run: node scripts/check-lint-budget.mjs

      # Issue #231：中文硬编码检查 —— package.json 里一直有 lint:i18n，此前同样不在 CI。
      - name: i18n hardcode check
        run: pnpm lint:i18n

      - name: Run tests
        run: pnpm test

      # Reports the outcome of the steps above. It deliberately does NOT re-run
      # the suite: the previous implementation shelled out to a second
      # `vitest run --reporter=json` whose output exceeded execSync's 1 MB buffer.
      - name: Comment CI result on PR
        if: github.event_name == 'pull_request' && success()
        # 评论只是「锦上添花」的反馈：fork PR（token 只读）或仓库权限收紧时
        # 必然 403。不应因此把 typecheck/test 通过的 job 判为失败。
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                '## CI Results',
                '',
                '✅ `pnpm lint` (tsc --noEmit) passed',
                '✅ `pnpm lint:strict` (tsc strict) passed',
                '✅ `pnpm test` (vitest) passed',
              ].join('\n'),
            });

  # ═══════════════════════════════════════════════════════════════════════════
  # Node 运行时守卫：受支持版本矩阵（20 / 22 / 24）
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # 存在的理由：better-sqlite3 是**原生模块**，`.node` 二进制按 Node ABI 编译。
  # 客户机换 Node 版本后复用旧 node_modules，会在运行期炸出 ERR_DLOPEN_FAILED ——
  # 那条原生报错对客户不可操作。平台因此只承诺**实测过**的主版本，并在安装期与
  # 启动期各设一道闸（scripts/assert-node-runtime.mjs + server/security/runtime-preflight.ts）。
  #
  # 这个矩阵 job 证明三件事：
  #   1. 受支持版本上安装期守卫放行（`pnpm install` 本身就会跑 preinstall 钩子）；
  #   2. 该 Node 版本上 better-sqlite3 原生绑定**能加载** —— ABI 真的匹配，
  #      这是「该版本真的可用」的判据（安装期守卫查不到这一层）；
  #   3. 守卫自身的单测在该版本上通过。
  #
  # 只跑这三件事，不跑全量单测：全量套件已在 Node 22 上跑（typecheck-and-test），
  # 这里要的是「版本矩阵上的运行时事实」，不是把测试重复一遍。
  #
  # ⚠️ 若某条依赖日后把 engines 抬到 Node 22+，本矩阵的 Node 20 一档会红 ——
  #    那不是「CI 坏了」，而是「Node 20 已经不再受支持」，此时应把 20 从
  #    SUPPORTED_NODE_MAJORS / engines / 矩阵里一起摘掉，而不是把矩阵关掉。
  node-runtime-compat:
    name: Node runtime guard (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # 这一步本身就会执行 package.json 的 preinstall 守卫：版本不受支持时
      # 安装当场失败，而不是装完才在运行期炸。
      - name: Install dependencies (preinstall guard runs here)
        run: pnpm install --frozen-lockfile

      - name: Runtime guard accepts this Node version
        run: node scripts/assert-node-runtime.mjs

      - name: Native binding loads on this Node ABI
        run: node -e "require('better-sqlite3'); console.log('better-sqlite3 OK on Node ' + process.version)"

      - name: Node runtime guard unit tests
        run: pnpm vitest run scripts/__tests__/node-runtime-guard.test.ts

  # ═══════════════════════════════════════════════════════════════════════════
  # 格式门禁（Issue #236；2026-10-25 改为全仓基线棘轮）
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # 存在的理由：仓库此前从未整体跑过 prettier，风格各文件各写各的。格式统一的
  # 成果如果不挂门禁，几周内就会被新的改动侵蚀干净 —— 所以必须挂。
  #
  # **检查范围：全仓**（`scripts/check-format-budget.mjs`，与 ESLint 告警预算棘轮同构）。
  #
  # 为什么从「本次变更触及的文件」改成全仓 —— 那是**责任漂移**漏洞：
  # 文件一旦合入 main，只要后续没有 PR 再碰它，就再也不会被任何一次 CI 检查。
  # 实测（2026-10-24 审计）：5 个文件不合规，其中 4 个来自当天合入的
  # #287/#288/#289/#290 —— 那三次 main push 的 CI **确实红了**（失败 job 就是
  # Format check），但因为后续 PR 不再触碰这些文件，HEAD 的 CI 11 个 job 全绿，
  # 而 main 里仍躺着不合规文件。**「CI 绿」在这里是不真实的。**
  #
  # 零基线之后，「整仓检查会把别人的历史遗留问题变成当前 PR 的失败」这个顾虑
  # 不再成立：不合规只可能由某次提交引入，而那次提交对应的 PR 就是第一个看到
  # 全仓检查失败的地方 —— 也就是引入它的那一次。基线清单（config/format-budget.json）
  # 当前为空，即**全仓必须合规**。
  #
  # 失败即红，不加 continue-on-error：格式问题必须当场修，不能靠「反正不阻断」。
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 全仓格式基线棘轮：清单之外出现不合规文件即失败（不许欠新债）。
      # 清理后运行 `node scripts/check-format-budget.mjs --update` 收紧基线。
      - name: Format budget ratchet
        run: node scripts/check-format-budget.mjs

  # 固定版本的真实插件作为宿主兼容性金丝雀。
  # 更新插件基线时同步修改下方三处 ref；每个门禁运行都可复现相同插件源码。
  # ═══════════════════════════════════════════════════════════════════════════
  # Windows 平台探测（**非阻塞**）
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # 存在的理由：L-1（进程隔离）、L-2（bootstrap 与 PluginHost 拆分）全部在 Linux
  # 上开发与验证 —— 此前本文件的 6 个 job **无一例外**是 ubuntu-latest，仓库里也
  # 没有任何 Windows 平台分支、docs/README 里零处 Windows 提及。而产品的主要
  # 用户据称在 Windows 上。
  #
  # 其中有几件事处于「未知」状态，任何一件为「否」都会让某个默认行为失效：
  #
  #   · `--permission` 不可用 → L-1 P2 的权限收敛整个失效。而 P2 把它**默认开启**，
  #     后果是 Windows 上插件直接起不来。
  #   · `--disallow-code-generation-from-strings` 不可用 → eval/new Function 禁令失效。
  #   · 信号终止后 exit.code 不为 null → 现有集成测试会在 Windows 上红。
  #
  # 这些都无法在 Linux 上回答，所以本 job 的产物是**那张表变成有据**，而不是一个
  # 绿色的勾。因此：
  #
  #   · `continue-on-error: true` —— 故意不卡合并。首跑大概率有红，红了才是信息。
  #   · 先跑 `probe-platform-capabilities.mjs`：它只报告不改状态，输出人可读，
  #     且作为 artifact 上传 —— 即使测试全红，报告也能回答「Windows 上能不能跑」。
  #   · 再跑平台最敏感的两个测试目录（worker-runtime / plugin-host）。这两个目录
  #     覆盖子进程 spawn、权限旗标、路径归一化、信号语义。
  #
  # ⚠️ 本 job 由 agent 在 Linux 上编写，**从未在 Windows 上跑过**。首次运行的结果
  #    就是它存在的意义 —— 请把首次结果当作「Windows 支持现状」的第一次实测，
  #    而不是回归失败。
  #
  # 待办：把首次红项分类（真缺陷 / 平台差异 / 探针自身写错），修完后移除
  #       continue-on-error，转为阻塞门禁。
  windows-platform-probe:
    name: Windows platform probe (non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin SDK
        run: node scripts/build-plugin-sdk.mjs

      - name: Probe platform capabilities
        run: node scripts/probe-platform-capabilities.mjs

      - name: Upload capability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-capability-report-windows
          path: dist/platform-capability-report.txt
          if-no-files-found: warn

      - name: Type check
        run: pnpm lint

      - name: Platform-sensitive unit tests
        id: platform-tests
        run: pnpm vitest run packages/core/worker-runtime packages/core/plugin-host

      # 只在测试步骤自己失败时再跑一遍 verbose。安装或类型检查失败时
      # 依赖还没就绪，这里再调 vitest 只会再报一次「命令找不到」，盖住真正的错误。
      - name: Dump worker-runtime test output on failure
        if: failure() && steps.platform-tests.outcome == 'failure'
        run: pnpm vitest run packages/core/worker-runtime --reporter=verbose

  plugin-compatibility:
    name: Third-party plugin compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install platform dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout attendance-record compatibility fixture
        uses: actions/checkout@v7
        with:
          repository: openlearn-next/attendance-record
          ref: ce8541e7a48b286574ffd620fa167cf5b139e451
          path: .plugin-compatibility-sources/attendance-record

      - name: Checkout class_manager compatibility fixture
        uses: actions/checkout@v7
        with:
          repository: openlearn-next/class_manager
          ref: 941b556f0017ec20e8a8d7a1f75d1dd9f80dd26f
          path: .plugin-compatibility-sources/class_manager

      - name: Checkout interactive-courseware compatibility fixture
        uses: actions/checkout@v7
        with:
          repository: openlearn-next/interactive-courseware
          ref: d622e0a54463813631f41589fa8d24082160b39d
          path: .plugin-compatibility-sources/interactive-courseware

      - name: Build attendance-record
        working-directory: .plugin-compatibility-sources/attendance-record
        run: npm install --no-audit --no-fund && npm run build

      - name: Build class_manager
        working-directory: .plugin-compatibility-sources/class_manager
        # Its esbuild config bundles @openlearn/plugin-sdk with external: [],
        # and the pinned SDK build imports uuid; supply the missing build-time dep.
        run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund uuid@14.0.1 && npm run build

      - name: Build interactive-courseware
        working-directory: .plugin-compatibility-sources/interactive-courseware
        run: pnpm install --no-frozen-lockfile && pnpm build

      - name: Stage plugin ZIP fixtures
        run: |
          node scripts/stage-plugin-compat-fixture.mjs attendance-record .plugin-compatibility-sources/attendance-record .plugin-compatibility-fixtures
          node scripts/stage-plugin-compat-fixture.mjs class_manager .plugin-compatibility-sources/class_manager .plugin-compatibility-fixtures
          node scripts/stage-plugin-compat-fixture.mjs interactive-courseware .plugin-compatibility-sources/interactive-courseware .plugin-compatibility-fixtures

      - name: Install and activate fixtures in the PR platform runtime
        env:
          OPENLEARN_PLUGIN_COMPAT_FIXTURES: .plugin-compatibility-fixtures
        run: pnpm exec vitest run server/__tests__/canary/plugin-compatibility.test.ts

  browser-workflow-e2e:
    name: Browser workflow E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: pnpm exec playwright test e2e/lesson-classroom-flow.spec.ts e2e/segment-gate-lock.spec.ts

      # 课中授课页面文字对比度（Issue #77）：axe-core color-contrast + 四套主题。
      # 组件里写死的亮色底配白字（如 bg-amber-500 text-white 仅 2.15:1）只有真实
      # 渲染才能发现，故单独成 job 步骤（失败即红，防止对比度回归）。
      - name: Run live-class contrast audit
        run: pnpm exec playwright test e2e/live-class-contrast.spec.ts

      # 全站无障碍门禁（WCAG 2.0/2.1 A+AA）：登录页 + 教师端主要工作区跑完整 axe 规则集，
      # 断言零违规。挡住 button-name / select-name / 结构性 ARIA / 对比度等回归。
      - name: Run accessibility gate
        run: pnpm exec playwright test e2e/a11y-gate.spec.ts

      # 外壳请求卫生：教师/学生外壳加载过程中不得出现任何 console 错误或 4xx/5xx 响应。
      # 这类缺陷（学生端请求越权接口吃 403、外壳回写拿到 404）单测抓不到 ——
      # 只有真实浏览器才知道「学生登录后那个外壳到底发了哪些请求」。
      - name: Run shell request hygiene gate
        run: pnpm exec playwright test e2e/shell-request-hygiene.spec.ts

  # ═══════════════════════════════════════════════════════════════════════════
  # 全量 e2e（Issue #230）
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # 此前 CI 只点名跑了 6 个 spec（26 个里的 23%）—— 课堂互动、并发一致性、
  # 教师工作流等核心链路的 e2e 从不在 CI 运行，回归只能靠人工点。
  #
  # 本 job 跑**全部** e2e（`pnpm test:e2e` = 默认配置覆盖 e2e/ 下所有 spec），
  # 新增 spec 自动进 CI，不必再维护一份「点名清单」。
  #
  # 为什么先 `continue-on-error: true`：
  # 与本文件里的 `windows-platform-probe` 同一思路 —— **首跑是为了把现状摸出来**。
  # 本地全量跑（main，25 个 spec）实测 26 通过 / 11 失败 / 2 未跑；失败集中在
  # 课堂黄金旅程、课表、机房、课后复盘等**长链路**用例，其中也包含当前已在 CI 跑的
  # `lesson-classroom-flow` —— 说明其中一部分是环境/时序敏感的既有不稳定项，
  # 而不是「一直没跑所以坏了」。
  #
  # 因此先让它们**在 CI 里跑起来并暴露状态**（而不是静默地不在 CI 跑），
  # 下一轮再把失败用例分类：能修的修，确实不稳定的用 `test.describe.skip`
  # **登记原因**（见 issue 建议修法第 2 条），之后去掉 continue-on-error 转为阻塞门禁。
  e2e-full-coverage:
    name: E2E full coverage (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run all e2e specs
        run: pnpm test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-full-coverage-artifacts
          path: |
            test-results/
            artifacts/
          if-no-files-found: warn

  # 公测关键旅程。失败即阻断合并：不设置 continue-on-error。
  # 覆盖教师建班布置、学生加入并提交、教师批改、跨班越权、管理员安装并启用插件。
  # 生产启动拒绝种子口令等于用户名，本 job 使用强测试口令。口令等于用户名时的强制改密由单元测试覆盖。
  public-beta-journey:
    name: Public beta journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin SDK
        run: node scripts/build-plugin-sdk.mjs

      - name: Run public beta journey
        run: pnpm exec playwright test --config=playwright.beta.config.ts

  # 全角色功能巡检（pnpm sweep）：枚举所有角色、所有视图的入口，逐个访问并收集
  # 「未捕获异常 / 导航失败 / 任何 4xx·5xx 响应」。
  #
  # 与 browser-workflow-e2e 互补：那些 spec 是**点选式**覆盖（点过的地方），
  # sweep 是**枚举式**覆盖（侧边栏每个导航项 + 运行时发现的插件页签）。
  # 阻断性问题即红（退出码 1）；报告与截图作为 artifact 上传。
  feature-sweep:
    name: Feature sweep (all roles)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin SDK
        run: node scripts/build-plugin-sdk.mjs

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # 巡检在**一次性演示库**（storage/demo.db）上跑，不碰开发库；
      # 内部自己起服务、跑完自己停。
      - name: Run feature sweep
        run: pnpm sweep

      # 报告进 job summary：PR 里不用下载 artifact 就能看到「哪个视图坏了」
      - name: Append sweep report to job summary
        if: always()
        run: |
          if [ -f artifacts/sweep/report.md ]; then
            echo '## 功能巡检报告' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/sweep/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '巡检未产出报告（详见 artifacts/sweep/server.log）' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sweep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feature-sweep-report
          path: |
            artifacts/sweep/report.md
            artifacts/sweep/report.json
            artifacts/sweep/screenshots/
            artifacts/sweep/server.log
          if-no-files-found: warn

  docs-drift-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run docs-vs-code architecture drift audit
        id: audit
        run: bash audit-tools/run.sh

      - name: Upload drift report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: drift-report
          path: audit-tools/reports/drift_report.md

      - name: Comment drift report on PR
        if: github.event_name == 'pull_request' && always() && steps.audit.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('audit-tools/reports/drift_report.md')
              ? fs.readFileSync('audit-tools/reports/drift_report.md', 'utf8')
              : 'No report file produced.';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                '## 📝 Architecture Docs Drift Audit — FAILED',
                '',
                'The architecture docs-vs-code audit detected drift. Please update the affected docs (or run `bash audit-tools/run.sh` locally to inspect).',
                '',
                '<details><summary>Full drift report</summary>',
                '',
                '```',
                report,
                '```',
                '',
                '</details>',
              ].join('\n'),
            });

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # 仓库没有 package-lock.json，必须用 pnpm audit。
      # 钉死官方 registry：镜像源（例如 npmmirror）没有 audit 端点时会
      # ERR_PNPM_AUDIT_ENDPOINT_NOT_EXISTS，那是基础设施失败，不能当成「无漏洞」。
      # --audit-level high：moderate / low 不阻断；存在 high 或 critical 时本 job 失败。
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit dependencies (block on high and critical)
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: pnpm audit --audit-level high --registry https://registry.npmjs.org/

  # 覆盖率独立成 job（typecheck-and-test 失败不影响收集）。
  # ⚠️ 已知行为：vitest 4 在测试运行存在失败用例时会静默跳过覆盖报告
  # （本地实测 v4.1.9 复现）。因此此 job 的意义在于「全绿时产出基线」；
  # 若需失败场景也出报告，需升级 vitest 或拆分失败用例。
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin SDK
        run: node scripts/build-plugin-sdk.mjs

      - name: Run tests with coverage
        run: pnpm test:coverage -- --coverage.reporter=json-summary --coverage.reportOnFailure=true

      - name: Append summary to job summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage" >> $GITHUB_STEP_SUMMARY
            node -e "const t = require('./coverage/coverage-summary.json').total; console.log('| 指标 | 覆盖率 |\\n|---|---|'); for (const k of ['lines','statements','functions','branches']) console.log('| ' + k + ' | ' + t[k].pct + '% |')" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Coverage" >> $GITHUB_STEP_SUMMARY
            echo "coverage-summary.json 未生成（测试执行发生致命错误或中断）" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Coverage ratchet (Issue #232)
        if: always()
        run: node scripts/coverage-ratchet.mjs coverage/coverage-summary.json

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
