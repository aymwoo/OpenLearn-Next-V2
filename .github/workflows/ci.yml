name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    # `issues: write` is required by the PR-comment step below. The default token
    # is read-only for issues, which is why that step used to fail with 403.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      # pnpm must be set up *before* setup-node, otherwise `cache: 'pnpm'` cannot
      # locate the pnpm store.
      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # This is a pnpm workspace with no package-lock.json, so the previous
      # `cache: 'npm'` + `npm ci` pair always failed with ENOLOCK before any
      # type checking or test ran.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      # Reports the outcome of the steps above. It deliberately does NOT re-run
      # the suite: the previous implementation shelled out to a second
      # `vitest run --reporter=json` whose output exceeded execSync's 1 MB buffer.
      - name: Comment CI result on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                '## CI Results',
                '',
                '✅ `pnpm lint` (tsc --noEmit) passed',
                '✅ `pnpm test` (vitest) passed',
              ].join('\n'),
            });

  docs-drift-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run docs-vs-code architecture drift audit
        id: audit
        run: bash audit-tools/run.sh

      - name: Upload drift report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: audit-tools/reports/drift_report.md

      - name: Comment drift report on PR
        if: github.event_name == 'pull_request' && always() && steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('audit-tools/reports/drift_report.md')
              ? fs.readFileSync('audit-tools/reports/drift_report.md', 'utf8')
              : 'No report file produced.';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                '## 📝 Architecture Docs Drift Audit — FAILED',
                '',
                'The architecture docs-vs-code audit detected drift. Please update the affected docs (or run `bash audit-tools/run.sh` locally to inspect).',
                '',
                '<details><summary>Full drift report</summary>',
                '',
                '```',
                report,
                '```',
                '',
                '</details>',
              ].join('\n'),
            });

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      # `npm audit` cannot work here (no package-lock.json → ENOLOCK).
      # Non-blocking on purpose: the repo currently carries pre-existing high
      # advisories in transitive dev dependencies (browserslist via
      # @vitejs/plugin-react). Flip continue-on-error to false once triaged.
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level high
