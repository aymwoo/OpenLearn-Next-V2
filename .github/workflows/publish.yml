name: Publish to NPM

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 每个 publish step 都是幂等的：若该版本已存在于 npm 则跳过，而不是抛
      # EPUBLISHCONFLICT 中断整个 job。这样 workflow_dispatch 重跑、以及
      # 「某个包版本号没动」的再次 push 都是安全的。
      - name: Publish @openlearn/plugin-sdk
        run: |
          PKG=$(node -p "require('./packages/plugin-sdk/package.json').name")
          VER=$(node -p "require('./packages/plugin-sdk/package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::notice title=Skipped::$PKG@$VER already exists on npm"
            exit 0
          fi
          echo "::notice title=Publishing::$PKG@$VER"
          cd packages/plugin-sdk && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @openlearn/plugin-test-kit
        run: |
          PKG=$(node -p "require('./packages/plugin-test-kit/package.json').name")
          VER=$(node -p "require('./packages/plugin-test-kit/package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::notice title=Skipped::$PKG@$VER already exists on npm"
            exit 0
          fi
          # `workspace:*` 必须在发布的 tarball 里展开为具体范围；
          # trap 保证即使 publish 失败也会把 package.json 还原。
          trap 'git checkout -- packages/plugin-test-kit/package.json' EXIT
          SDK_VER=$(node -p "require('./packages/plugin-sdk/package.json').version")
          sed -i 's|"@openlearn/plugin-sdk": "workspace:\*"|"@openlearn/plugin-sdk": "^'"$SDK_VER"'"|' packages/plugin-test-kit/package.json
          echo "::notice title=Publishing::$PKG@$VER"
          cd packages/plugin-test-kit && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish openlearn-next
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::notice title=Skipped::$PKG@$VER already exists on npm"
            exit 0
          fi
          trap 'git checkout -- package.json' EXIT
          SDK_VER=$(node -p "require('./packages/plugin-sdk/package.json').version")
          sed -i 's|"@openlearn/plugin-sdk": "workspace:\*"|"@openlearn/plugin-sdk": "'"${SDK_VER}"'"|' package.json
          pnpm build
          echo "::notice title=Publishing::$PKG@$VER"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Sync to npmmirror (Chinese mirror)
      - name: Sync to npmmirror
        run: |
          curl -fsSL -X PUT "https://registry.npmmirror.com/-/package/@openlearn/plugin-sdk/sync" || true
          curl -fsSL -X PUT "https://registry.npmmirror.com/-/package/@openlearn/plugin-test-kit/sync" || true
          curl -fsSL -X PUT "https://registry.npmmirror.com/-/package/openlearn-next/sync" || true
