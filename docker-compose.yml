# 直连：docker compose up -d --build
# 反代：TRUST_PROXY=1 docker compose --profile proxy up -d --build
# 直连公网时不要设置 TRUST_PROXY，否则客户端可以伪造 X-Forwarded-For 拆开限流桶。
services:
  app:
    build: .
    ports:
      - '9000:9000'
    volumes:
      # 一个数据卷：SQLite、课件 storage、插件目录、上传文件。
      # 不要再把库挂到 /app/packages/core/db、把课件挂到 /app/storage——
      # 设置了 OPENLEARN_DB_PATH 且未设置 OPENLEARN_DATA_DIR 时，课件会写到库文件的同级目录，两个卷对不上。
      - openlearn_data:/data
      - openlearn_backups:/backups
    environment:
      NODE_ENV: production
      OPENLEARN_DATA_DIR: /data
      OPENLEARN_DB_PATH: /data/educational_os.db
      BACKUP_DIR: /backups
      LOG_DIR: /data/logs
      OPENLEARN_PLUGINS_DIR: /data/plugins
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_REDACT: ${LOG_REDACT:-}
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB:-}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-}
      AUDIT_LOG_MAX_SIZE_MB: ${AUDIT_LOG_MAX_SIZE_MB:-}
      AUDIT_LOG_MAX_FILES: ${AUDIT_LOG_MAX_FILES:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPENLEARN_ERROR_DSN: ${OPENLEARN_ERROR_DSN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OPENLEARN_ADMIN_PASSWORD: ${OPENLEARN_ADMIN_PASSWORD:-}
      OPENLEARN_TEACHER_PASSWORD: ${OPENLEARN_TEACHER_PASSWORD:-}
      # 空字符串表示不信任转发头。只有前面确实有 Nginx 时才设为 1 或 loopback。
      TRUST_PROXY: ${TRUST_PROXY:-}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  proxy:
    image: nginx:1.27-alpine
    profiles: ['proxy']
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '8080:80'
    volumes:
      - ./deploy/nginx/openlearn.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  openlearn_data:
  openlearn_backups:
