services:
  app:
    build: .
    ports:
      - '9000:9000'
    volumes:
      - db_data:/app/packages/core/db
      - storage_data:/app/storage
      - backup_data:/app/backups
      # 日志持久化：此前未挂载，容器重建即丢失全部排障日志
      - logs_data:/app/logs
    environment:
      - NODE_ENV=production
      - OPENLEARN_DB_PATH=/app/packages/core/db/educational_os.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=info
      - BACKUP_DIR=/app/backups
    restart: unless-stopped

volumes:
  db_data:
  storage_data:
  backup_data:
  logs_data:
